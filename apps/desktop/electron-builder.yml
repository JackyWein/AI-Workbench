appId: com.aiworkbench.desktop
productName: AI Workbench
# The package name is scoped, which is not a usable file name.
executableName: ai-workbench
copyright: AI Workbench

directories:
  output: ../../release
  buildResources: build

# Everything the application needs at runtime is either bundled into out/ or a
# real npm dependency; workspace packages are compiled in and never shipped.
files:
  - out/**/*
  - package.json
  - "!**/*.map"

# The SQLite client is a native N-API module and must stay outside the asar
# archive so the dynamic loader can find it.
asarUnpack:
  - "**/*.node"
  - "node_modules/@libsql/**"

# N-API modules are ABI stable, so there is nothing to rebuild per Electron
# version. Keeping this off also avoids a rebuild pass that workspace
# installs make unreliable.
npmRebuild: false

# The provider setting only decides which metadata electron-builder writes
# next to the artifacts (latest*.yml). Nothing is uploaded from here: the
# release workflow copies the artifacts and that metadata to the GitHub
# release, and the packaged app reads updates back from there. The package
# script passes --publish never: without it electron-builder publishes by
# itself when it builds a tag in CI, which failed the 0.0.3 release (no
# token), and the release job is what publishes.
publish:
  provider: github
  owner: JackyWein
  repo: AI-Workbench

# The notes the updater shows before an update; the same file is the body of
# the GitHub release.
releaseInfo:
  releaseNotesFile: release-notes.md

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-windows-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-windows-portable-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-macos-${arch}.${ext}

linux:
  # Lets desktop environments associate running windows with the launcher entry;
  # the name itself comes from package.json.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Development
  synopsis: Local desktop environment for multiple AI providers
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
