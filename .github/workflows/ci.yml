name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Node still runs the tools themselves (vitest, electron-builder); bun
      # installs the dependencies and runs the scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify bundled memory server
        run: bun run verify:memory

      # Starts the built application headlessly and asserts that it really
      # comes up and that a conversation survives a restart.
      - name: Verify application startup
        run: xvfb-run -a bun run verify:app

  # The release tests and packages on Windows and macOS as well. Doing the
  # same on every push finds a platform difference here, before a release tag
  # runs into it.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # The application folder the installers are made from, unsigned and
      # never published; the release builds the installers themselves.
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        working-directory: apps/desktop
        run: bun run package:dir

      - name: Verify bundled memory server
        run: bun run verify:memory

      - name: Verify packaged memory server
        if: runner.os == 'Windows'
        run: bun run verify:memory:package
