name: Release

# Builds installable packages on real runners for each platform, because
# Windows and macOS packages cannot be produced from a Linux machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Node still runs the tools themselves (vitest, electron-builder); bun
      # installs the dependencies and runs the scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Signed when the project's certificates are stored as repository
      # secrets (SIGNING.md), unsigned otherwise — the build never stalls
      # waiting for a certificate that is not there.
      - name: Package
        shell: bash
        env:
          # macOS: a Developer ID Application certificate (.p12, base64) and
          # the account that notarizes the app with Apple.
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows, either a code signing certificate (.pfx, base64)...
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # ...or Microsoft's Azure Trusted Signing.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          extra=()
          case "${{ matrix.name }}" in
            macos)
              if [ -n "$MAC_CERTIFICATE" ]; then
                export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
                echo "Signing for macOS; notarizing: $([ -n "$APPLE_ID" ] && echo yes || echo no)"
              else
                export CSC_IDENTITY_AUTO_DISCOVERY=false
                unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
                echo "No macOS certificate: unsigned"
              fi
              ;;
            windows)
              if [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_SIGNING_ENDPOINT" ]; then
                extra+=(
                  "-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"
                  "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
                  "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"
                  "-c.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER"
                )
                echo "Signing for Windows with Azure Trusted Signing"
              elif [ -n "$WINDOWS_CERTIFICATE" ]; then
                export WIN_CSC_LINK="$WINDOWS_CERTIFICATE" WIN_CSC_KEY_PASSWORD="$WINDOWS_CERTIFICATE_PASSWORD"
                echo "Signing for Windows with a certificate"
              else
                export CSC_IDENTITY_AUTO_DISCOVERY=false
                echo "No Windows certificate: unsigned"
              fi
              ;;
            *)
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              ;;
          esac
          bun run build
          bun run verify:memory
          cd apps/desktop
          bunx electron-builder --publish never "${extra[@]}"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # Only installable output, not the intermediate unpacked directories.
          # The latest*.yml metadata and blockmap files travel with the
          # installers: electron-updater needs them to find new versions.
          find release -maxdepth 1 -type f \
            \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" \
               -o -name "*.AppImage" -o -name "*.tar.gz" \
               -o -name "latest*.yml" -o -name "*.blockmap" \) \
            -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ai-workbench-${{ matrix.name }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      # The update metadata names the commit it was built from: an installed
      # build compares it with its own, so a version published again from a
      # newer commit is still offered as an update.
      - name: Name the commit in the update metadata
        run: |
          for file in release-files/latest*.yml; do
            printf 'commit: %s\n' "$GITHUB_SHA" >> "$file"
            echo "$file"; tail -n 2 "$file"
          done

      - uses: actions/checkout@v4
        with:
          path: source

      # What changed, from the same file the updater shows, then how to
      # install.
      - name: Release notes
        run: |
          {
            if [ -f source/apps/desktop/release-notes.md ]; then
              tail -n +2 source/apps/desktop/release-notes.md
              echo
            fi
            cat <<'EOF'
          ### Install

          | Platform | File |
          |---|---|
          | Windows | `*-windows-x64.exe` (installer) or the `portable` build |
          | macOS | `*-macos-arm64.dmg` (Apple silicon) or `*-macos-x64.dmg` (Intel) |
          | Linux | `*-linux-x86_64.AppImage` or `*-linux-x64.tar.gz` |

          The packages are **not code signed**. Windows SmartScreen and macOS
          Gatekeeper will warn on first launch; on macOS open it once via
          right click → Open, or run
          `xattr -dr com.apple.quarantine "/Applications/AI Workbench.app"`.
          EOF
          } | sed 's/^          //' > release-body.md
          cat release-body.md

      # Releasing a version again replaces it instead of leaving a second,
      # differently named set of files next to the first. Built from the
      # same commit, only the files are replaced. Built from a newer one, the
      # earlier release and its tag go, so the release, its files, its notes
      # and its tag all name the commit that was built.
      - name: Clear an earlier upload of this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.package.outputs.version }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null || true)
            if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "$TAG was built from $tagged; replacing it with $GITHUB_SHA"
              gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
            else
              gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
                while IFS= read -r asset; do
                  echo "removing $asset"
                  gh release delete-asset "$TAG" "$asset" -R "$GITHUB_REPOSITORY" --yes
                done
            fi
          fi

      - uses: softprops/action-gh-release@v2
        with:
          # A manual run tags the current commit with the application version,
          # so a release can be produced without pushing a tag by hand.
          tag_name: v${{ needs.package.outputs.version }}
          # The commit that was built, not whatever the branch points to by
          # the time the packages are done.
          target_commitish: ${{ github.sha }}
          name: AI Workbench v${{ needs.package.outputs.version }}
          files: release-files/*
          body_path: release-body.md
