name: Release

# Builds installable packages on real runners for each platform, because
# Windows and macOS packages cannot be produced from a Linux machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package
        # The packages are unsigned; signing needs certificates this project
        # does not have, and the build must not stall waiting for them.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # Only installable output, not the intermediate unpacked directories.
          find release -maxdepth 1 -type f \
            \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" \
               -o -name "*.AppImage" -o -name "*.tar.gz" \) \
            -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ai-workbench-${{ matrix.name }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          body: |
            Desktop packages for Windows, macOS and Linux.

            | Platform | File |
            |---|---|
            | Windows | `*-windows-x64.exe` (installer) or the `portable` build |
            | macOS | `*-macos-arm64.dmg` (Apple silicon) or `*-macos-x64.dmg` (Intel) |
            | Linux | `*-linux-x86_64.AppImage` or `*-linux-x64.tar.gz` |

            The packages are **not code signed**. Windows SmartScreen and macOS
            Gatekeeper will warn on first launch; on macOS open it once via
            right click → Open, or run
            `xattr -dr com.apple.quarantine "/Applications/AI Workbench.app"`.
