name: Release

# Builds installable packages on real runners for each platform, because
# Windows and macOS packages cannot be produced from a Linux machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Node still runs the tools themselves (vitest, electron-builder); bun
      # installs the dependencies and runs the scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Package
        # The packages are unsigned; signing needs certificates this project
        # does not have, and the build must not stall waiting for them.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run package

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # Only installable output, not the intermediate unpacked directories.
          # The latest*.yml metadata and blockmap files travel with the
          # installers: electron-updater needs them to find new versions.
          find release -maxdepth 1 -type f \
            \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" \
               -o -name "*.AppImage" -o -name "*.tar.gz" \
               -o -name "latest*.yml" -o -name "*.blockmap" \) \
            -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ai-workbench-${{ matrix.name }}
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      - uses: actions/checkout@v4
        with:
          path: source

      # What changed, from the same file the updater shows, then how to
      # install.
      - name: Release notes
        run: |
          {
            if [ -f source/apps/desktop/release-notes.md ]; then
              tail -n +2 source/apps/desktop/release-notes.md
              echo
            fi
            cat <<'EOF'
          ### Install

          | Platform | File |
          |---|---|
          | Windows | `*-windows-x64.exe` (installer) or the `portable` build |
          | macOS | `*-macos-arm64.dmg` (Apple silicon) or `*-macos-x64.dmg` (Intel) |
          | Linux | `*-linux-x86_64.AppImage` or `*-linux-x64.tar.gz` |

          The packages are **not code signed**. Windows SmartScreen and macOS
          Gatekeeper will warn on first launch; on macOS open it once via
          right click → Open, or run
          `xattr -dr com.apple.quarantine "/Applications/AI Workbench.app"`.
          EOF
          } | sed 's/^          //' > release-body.md
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          # A manual run tags the current commit with the application version,
          # so a release can be produced without pushing a tag by hand.
          tag_name: v${{ needs.package.outputs.version }}
          # The commit that was built, not whatever the branch points to by
          # the time the packages are done.
          target_commitish: ${{ github.sha }}
          name: AI Workbench v${{ needs.package.outputs.version }}
          files: release-files/*
          body_path: release-body.md
